name: Support / bug report
description: Report an installation, identity, meter, MQTT, Home Assistant, or regression problem.
title: "[Support] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make Xcel Meter HA easier to support. Please read `docs/SUPPORT.md` first.

        Never paste `key.pem`, an unredacted Xcel account number, Wi-Fi password, or other credentials.

  - type: input
    id: version
    attributes:
      label: Xcel Meter HA version
      placeholder: 0.4.5b3
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version and installation type
      placeholder: Home Assistant 2026.x, HA OS / Container / Supervised
    validations:
      required: true

  - type: dropdown
    id: identity_origin
    attributes:
      label: Identity path
      options:
        - Fresh identity generated by Xcel Meter HA
        - Migrated from the legacy add-on
        - Existing app-owned identity
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: ever_authenticated
    attributes:
      label: Has this exact client identity ever authenticated successfully to the meter?
      options:
        - "Yes"
        - "No"
        - Not sure
    validations:
      required: true

  - type: dropdown
    id: failure_area
    attributes:
      label: Primary symptom
      options:
        - First-time provisioning / 401 / 403
        - LFDI mismatch
        - Meter unreachable / timeout
        - TLS / BAD_SIGNATURE
        - Discovery / reading problem
        - Instantaneous Power stale or unexpected
        - MQTT / Home Assistant availability
        - Energy Delivered / Received semantics
        - Upgrade regression
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include what you expected, what happened instead, and whether this worked before.
    validations:
      required: true

  - type: input
    id: tcp_8081
    attributes:
      label: Meter TCP 8081 reachability
      description: State whether the Home Assistant host/network can reach the meter on TCP 8081.
      placeholder: Reachable / not reachable / not tested
    validations:
      required: true

  - type: input
    id: mqtt
    attributes:
      label: MQTT status
      placeholder: Healthy / failing / disabled / not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized log excerpt
      description: Paste the smallest useful block around the first failure, usually 20-60 lines. Redact LFDIs, account data, IPs when unnecessary, and all credentials.
      render: text
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Meter/agent version if reported authoritatively, network changes, upgrade history, screenshots, or reproduction steps.

  - type: checkboxes
    id: safety
    attributes:
      label: Safety and privacy confirmation
      options:
        - label: I did not attach or paste `key.pem` or any private key.
          required: true
        - label: I redacted account numbers, customer identity, Wi-Fi credentials, and unrelated secrets.
          required: true
        - label: I understand that deleting/regenerating a provisioned identity is not a generic troubleshooting step and will describe it above if I already did so.
          required: true
