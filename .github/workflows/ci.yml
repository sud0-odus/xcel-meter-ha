name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Ruff
        run: python -m pip install ruff==0.13.2

      - name: Show Ruff version
        run: ruff --version

      - name: Lint
        run: ruff check src tests xcel-meter-diagnostic/src

      - name: Parse PowerShell simulator tooling
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/simulator/run-secure-simulator.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Verify root/add-on source parity
        run: diff -ru src/xcel_meter xcel-meter-diagnostic/src/xcel_meter

      - name: Verify package/app version parity
        run: |
          python - <<'PY'
          import pathlib
          import re
          root = pathlib.Path("pyproject.toml").read_text()
          addon = pathlib.Path("xcel-meter-diagnostic/pyproject.toml").read_text()
          config = pathlib.Path("xcel-meter-diagnostic/config.yaml").read_text()
          runtime = pathlib.Path("src/xcel_meter/version.py").read_text()
          rv = re.search(r'^version = "([^"]+)"', root, re.M).group(1)
          av = re.search(r'^version = "([^"]+)"', addon, re.M).group(1)
          cv = re.search(r'^version: "([^"]+)"', config, re.M).group(1)
          pv = re.search(r'^APP_VERSION = "([^"]+)"', runtime, re.M).group(1)
          assert rv == av == cv == pv, (rv, av, cv, pv)
          PY

  test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project and tests
        run: python -m pip install -e . 'pytest>=8.4,<9'

      - name: Test
        run: pytest -q
