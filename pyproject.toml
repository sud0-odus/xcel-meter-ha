[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "xcel-meter-ha"
version = "0.3.5"
description = "Maintained IEEE 2030.5 diagnostics and Home Assistant bridge for Xcel/Itron meters"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "BSD-3-Clause" }
dependencies = [
  "cryptography>=46.0.0,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff==0.13.2",
]

[project.scripts]
xcel-meter = "xcel_meter.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src/xcel_meter"]