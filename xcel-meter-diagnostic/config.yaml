name: "Xcel Meter HA"
version: "0.4.5"
slug: "xcel_meter_diagnostic"
description: "Local-first Xcel/Itron IEEE 2030.5 smart-meter bridge for Home Assistant"
arch:
  - amd64
  - aarch64
startup: application
boot: manual
init: false
stage: experimental
services:
  - mqtt:want
map:
  - type: addon_config
    read_only: false
  - type: all_addon_configs
    read_only: true
options:
  meter_ip: null
  meter_port: 8081
  expected_lfdi: ""
  identity_source: "auto"
  migrate_legacy_identity: true
  generate_identity_if_missing: true
  legacy_addon_slug: ""
  timeout: 8
  poll_interval: 60
  log_level: "INFO"
  mqtt_enabled: true
  energy_export_enabled: false
schema:
  meter_ip: str?
  meter_port: port
  expected_lfdi: str?
  identity_source: list(auto|own|legacy)
  migrate_legacy_identity: bool
  generate_identity_if_missing: bool
  legacy_addon_slug: str?
  timeout: int
  poll_interval: int
  log_level: list(DEBUG|INFO|WARNING|ERROR)
  mqtt_enabled: bool
  energy_export_enabled: bool
